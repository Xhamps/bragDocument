# Documentation only; nothing is generated from this file. Keep it in step with
# the DTOs in internal/adapters/http/*_handler.go.
openapi: 3.0.3
info:
  title: Brag Document API
  version: 0.1.0
  description: |
    All routes except /healthz, /readyz and /metrics require a Supabase access
    token as a Bearer token. The first authenticated request provisions the user:
    an invitation for the token's email joins that tenant as `member`, otherwise
    a new tenant is created with the user as `admin`.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /me:
    get:
      summary: The authenticated caller and their tenant
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/telegram:
    get:
      summary: The caller's Telegram link state (PRD-0003)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TelegramStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      summary: Unlink Telegram; a no-op when not linked
      responses:
        "204": { description: Unlinked }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/telegram/code:
    post:
      summary: Issue a one-time link code; the user sends "/start <code>" to the bot
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/TelegramCode" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Cache unavailable; linking needs Redis, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /documents:
    get:
      summary: List the caller's documents (owned and shared, archived included)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DocumentList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create a document owned by the caller
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateDocument" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Document" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /documents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: One document with the caller's role; clears the "New" badge (PRD-0004)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Document" } } } }
        "404": { description: Not found, or no role on the document, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      summary: Update title, description or state (owner only)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateDocument" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Document" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      summary: Delete a document (owner only)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /documents/{id}/logs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Filtered, sorted, paged logs of a document (read access; owner, editor, or viewer)
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Substring of name or description, case-insensitive }
        - { name: tag, in: query, schema: { type: array, items: { type: string } }, explode: true, description: Any-of }
        - { name: status, in: query, schema: { type: array, items: { $ref: "#/components/schemas/LogStatus" } }, explode: true }
        - { name: impact, in: query, schema: { type: array, items: { $ref: "#/components/schemas/Impact" } }, explode: true }
        - { name: from, in: query, schema: { type: string, format: date }, description: created_at on or after, UTC }
        - { name: to, in: query, schema: { type: string, format: date }, description: created_at on or before, UTC }
        - { name: domain, in: query, schema: { type: string }, description: Link host or any subdomain of it }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, -created_at, name, -name, impact, -impact, status, -status], default: -created_at } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: examples, in: query, schema: { type: string, enum: ["false"] }, description: "false hides example logs (matches the dashboard, PRD-0005 FR-6)" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LogList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    post:
      summary: Create a log; the impact statement is extracted from the text (PRD-0007)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateLog" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Log" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /documents/{id}/dashboard:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Log aggregates for a period, examples excluded (PRD-0005); read access
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: "UTC; default 12 months before to" }
        - { name: to, in: query, schema: { type: string, format: date }, description: "UTC, inclusive; default today" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Dashboard" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Not found, or no role on the document }
        "422": { description: Bad date, empty period, or longer than 5 years }
  /documents/{id}/report-settings:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: The document's report goals and tag-to-section mapping, defaults before the first export (PRD-0006); read access
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ReportSettings" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "Not found, or no role on the document" }
  /documents/{id}/exports:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: The caller's export jobs for this document, newest first (the dialog's history); read access
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ExportList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "Not found, or no role on the document" }
    post:
      summary: Queue a PDF report of the logs matching the list's filters (PRD-0006); read access. Editors and owners also save the settings sent; a viewer's are used for this report only
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateExportRequest" } } }
      responses:
        "202": { description: "Queued; poll GET /documents/{id}/exports/{jobId}", content: { application/json: { schema: { $ref: "#/components/schemas/ExportJob" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "Not found, or no role on the document" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { description: "Bad query (`fields` names the parameter), or `fields.filters` when no log or more than 2,000 logs match (FR-7)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /documents/{id}/exports/{jobId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: One of the caller's export jobs, with progress; read access
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ExportJob" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "Not found, another user's job, or no role on the document" }
  /documents/{id}/exports/{jobId}/file:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Download the PDF (attachment, Cache-Control no-store); read access is checked again
      responses:
        "200": { description: The report, content: { application/pdf: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "Not found, not done yet, failed, or expired (24 h after completion)" }
  /documents/{id}/logs/{logId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: logId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: One log (read access; owner, editor, or viewer; archived documents included)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Log" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update a log; re-extracts the impact statement when name or description changed
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateLog" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Log" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      summary: Delete a log
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /documents/{id}/example-logs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Delete the document's example logs
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /documents/{id}/sharing:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Grants and pending invitations; owner only
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Sharing" } } } }
        "403": { description: Not the owner; message names the caller's role, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      summary: Share with a member (grant) or an unknown email (held invitation); emails the recipient
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Share" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { kind: { type: string, enum: [grant, invitation] } } } } } }
        "409": { description: Already shared or invited }
        "422": { description: Bad email or role, or the caller's own email }
  /documents/{id}/grants/{userId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Change a grant's role; owner only
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [role], properties: { role: { type: string, enum: [editor, viewer] } } } } } }
      responses:
        "204": { description: Changed }
    delete:
      summary: Revoke a grant; takes effect on the next request
      responses:
        "204": { description: Revoked }
  /documents/{id}/invitations/{invId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: invId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Cancel a pending invitation; owner only
      responses:
        "204": { description: Cancelled }
  /documents/{id}/transfer:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Make another member the owner; the previous owner becomes an editor
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [user_id], properties: { user_id: { type: string, format: uuid } } } } } }
      responses:
        "204": { description: Transferred }
        "422": { description: Caller already owns it, or not a member }
  /documents/{id}/audit:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: The document's sharing history, newest first; owner only
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } } } } }
  /tenant/audit:
    get:
      summary: Every sharing change in the tenant; admin only, no content (PRD-0004 FR-8, FR-9)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } } } } }
        "403": { description: Not an admin }
  /tags:
    get:
      summary: The tenant's tag vocabulary, sorted
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [tags], properties: { tags: { type: array, items: { type: string } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /tenant/members:
    get:
      summary: List tenant members (admin only)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Member" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /tenant/members/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Remove a member (admin only; 422 for yourself, 409 if they still own documents)
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /tenant/invitations:
    get:
      summary: List pending invitations (admin only)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Invitation" } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Invite an email to the tenant (admin only; 409 if already a member or invited)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateInvitation" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Invitation" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /tenant/invitations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Revoke an invitation (admin only)
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Unauthorized: { description: Missing or invalid token, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: Not allowed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: Resource not found (also for other tenants' rows), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Conflict: { description: Conflict with current state, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    TooLarge: { description: Request body exceeds 1 MiB, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unprocessable: { description: Validation failed; `fields` names the offending inputs, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    Tenant:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Me:
      type: object
      required: [id, email, display_name, role, tenant]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { type: string, enum: [admin, member] }
        tenant: { $ref: "#/components/schemas/Tenant" }
    Document:
      type: object
      required: [id, owner_id, title, description, state, created_at, updated_at, role, is_new]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        state: { type: string, enum: [active, archived] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        role: { type: string, enum: [owner, editor, viewer] }
        owner_name: { type: string, description: "Owner's display name or email; omitted in the owned list" }
        is_new: { type: boolean, description: Shared and not opened yet }
        log_count: { type: integer, description: "Logs excluding examples. Set only by GET /documents (list); absent or zero elsewhere." }
        last_log_at: { type: string, format: date-time, nullable: true, description: "Newest created_at, null without logs. Set only by GET /documents (list); absent or zero elsewhere." }
    DocumentList:
      type: object
      required: [owned, shared]
      properties:
        owned: { type: array, items: { $ref: "#/components/schemas/Document" } }
        shared: { type: array, items: { $ref: "#/components/schemas/Document" } }
    CreateDocument:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
    UpdateDocument:
      type: object
      description: Absent fields are unchanged.
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        state: { type: string, enum: [active, archived] }
    Member:
      type: object
      required: [id, email, display_name, role, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { type: string, enum: [admin, member] }
        created_at: { type: string, format: date-time }
    Invitation:
      type: object
      required: [id, email, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        created_at: { type: string, format: date-time }
        document_title: { type: string, description: Set for document invitations; read-only here }
    CreateInvitation:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    Share:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [editor, viewer] }
    Sharing:
      type: object
      properties:
        grants:
          type: array
          items:
            type: object
            properties:
              user_id: { type: string, format: uuid }
              email: { type: string }
              display_name: { type: string }
              role: { type: string, enum: [editor, viewer] }
              granted_at: { type: string, format: date-time }
        invitations:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              email: { type: string }
              role: { type: string, enum: [editor, viewer] }
              created_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        actor_email: { type: string }
        action: { type: string, enum: [grant, invite, role_change, revoke, invite_cancel, invite_accept, transfer] }
        document_id: { type: string, format: uuid }
        document_title: { type: string }
        target: { type: string }
        role: { type: string }
        at: { type: string, format: date-time }
    Error:
      type: object
      required: [error, message, request_id]
      properties:
        error: { type: string, enum: [unauthorized, too_large, validation, not_found, forbidden, conflict, timeout, unavailable, internal] }
        message: { type: string }
        request_id: { type: string }
        fields: { type: object, additionalProperties: { type: string } }
    Impact: { type: string, enum: [low, medium, high, critical] }
    LogStatus: { type: string, enum: [idea, in_progress, done, dropped] }
    Link:
      type: object
      required: [url, label]
      properties:
        url: { type: string, format: uri, description: http or https only }
        label: { type: string, maxLength: 100, description: Optional in requests; always present in responses. }
    Log:
      type: object
      required: [id, document_id, name, description, impact, impact_statement, status, is_example, tags, links, created_at, created_by, updated_at, updated_by]
      properties:
        id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 20000, description: Markdown }
        impact: { $ref: "#/components/schemas/Impact" }
        impact_statement: { type: string, nullable: true, maxLength: 280, description: 'null: not checked; "": none found (PRD-0007)' }
        status: { $ref: "#/components/schemas/LogStatus" }
        is_example: { type: boolean }
        tags: { type: array, items: { type: string } }
        links: { type: array, items: { $ref: "#/components/schemas/Link" } }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, format: uuid }
    LogList:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Log" } }
        total: { type: integer }
    Bucket:
      type: object
      required: [key, count]
      properties:
        key: { type: string, description: "Month (YYYY-MM), tag, status, or impact" }
        count: { type: integer }
    Dashboard:
      type: object
      required: [from, to, total, in_period, high_impact, in_progress, months, tags, statuses, impacts, coverage]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date, description: Inclusive }
        total: { type: integer, description: All-time }
        in_period: { type: integer }
        high_impact: { type: integer, description: high + critical in period }
        in_progress: { type: integer, description: status in_progress in period }
        months: { type: array, items: { $ref: "#/components/schemas/Bucket" }, description: Every month of the period, zeros included }
        tags: { type: array, items: { $ref: "#/components/schemas/Bucket" }, description: Top 10 by count }
        statuses: { type: array, items: { $ref: "#/components/schemas/Bucket" } }
        impacts: { type: array, items: { $ref: "#/components/schemas/Bucket" } }
        coverage: { type: array, items: { $ref: "#/components/schemas/Bucket" }, description: "The article's suggested tags, zeros included" }
    ReportSettings:
      type: object
      required: [goals_this_year, goals_next_year, section_map]
      properties:
        goals_this_year: { type: string }
        goals_next_year: { type: string }
        section_map: { type: object, additionalProperties: { type: string }, description: "Tag to report section heading; untagged or unmapped logs go to Other" }
    CreateExportRequest:
      allOf:
        - $ref: "#/components/schemas/ReportSettings"
        - type: object
          properties:
            query: { type: string, description: "The logs list's URL query string, verbatim (FR-1), e.g. impact=high&from=2026-01-01; same parameters as GET /documents/{id}/logs, page and per_page ignored" }
    ExportJob:
      type: object
      required: [id, status, progress, error, created_at, expires_at, downloadable]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, done, failed] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        error: { type: string, description: "User-facing reason when failed; empty otherwise" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: "When the job and its file are deleted (24 h)" }
        downloadable: { type: boolean, description: "done and not expired; GET .../file serves it" }
    ExportList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ExportJob" } }
    CreateLog:
      type: object
      required: [name, impact]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 20000 }
        impact: { $ref: "#/components/schemas/Impact" }
        status: { $ref: "#/components/schemas/LogStatus" }
        tags: { type: array, maxItems: 20, items: { type: string, maxLength: 50 } }
        links: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/Link" } }
        created_at: { type: string, format: date-time, description: Defaults to now; set to back-date. Not more than 24 h in the future }
    UpdateLog:
      type: object
      description: Absent fields are unchanged; tags and links replace the whole set when present. null is treated as absent.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 20000 }
        impact: { $ref: "#/components/schemas/Impact" }
        status: { $ref: "#/components/schemas/LogStatus" }
        tags: { type: array, maxItems: 20, items: { type: string, maxLength: 50 } }
        links: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/Link" } }
        created_at: { type: string, format: date-time, description: Not more than 24 h in the future }
    TelegramStatus:
      type: object
      required: [linked]
      properties:
        linked: { type: boolean }
        linked_at: { type: string, format: date-time, description: Present only when linked }
        document_id: { type: string, format: uuid, description: The document new logs go to; present only when linked }
    TelegramCode:
      type: object
      required: [code, expires_at]
      properties:
        code: { type: string, description: One-time; valid until expires_at }
        expires_at: { type: string, format: date-time }
        bot_url: { type: string, format: uri, description: "t.me deep link pre-filling /start <code>; absent when TELEGRAM_BOT_USERNAME is not set" }
