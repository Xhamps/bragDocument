# Infra services start by default: docker compose up
# Full stack (API, bot, frontend): docker compose --profile app up --build
# See docs/adr/0008-docker-compose-for-local-provisioning.md

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brag}
      POSTGRES_DB: ${POSTGRES_DB:-brag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brag} -d ${POSTGRES_DB:-brag}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "${GOTENBERG_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    profiles: ["app"]
    build:
      context: ./backend
    command: ["migrate"]
    env_file: .env
    environment:
      DATABASE_OWNER_URL: postgres://${POSTGRES_USER:-brag}:${POSTGRES_PASSWORD:-brag}@postgres:5432/${POSTGRES_DB:-brag}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build:
      context: ./backend
    command: ["api"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://bragdoc_app:bragdoc_app@postgres:5432/${POSTGRES_DB:-brag}?sslmode=disable
      SUPABASE_URL: ${SUPABASE_URL_COMPOSE:-http://host.docker.internal:54321}
      REDIS_URL: redis://redis:6379/0
      GOTENBERG_URL: http://gotenberg:3000
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy

  bot:
    profiles: ["app"]
    build:
      context: ./backend
    command: ["bot"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://bragdoc_app:bragdoc_app@postgres:5432/${POSTGRES_DB:-brag}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_MODE: polling
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build:
      context: ./backend
    command: ["worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://bragdoc_app:bragdoc_app@postgres:5432/${POSTGRES_DB:-brag}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      GOTENBERG_URL: http://gotenberg:3000
    volumes:
      - exports:/data/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${API_PORT:-8080}
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  exports:
