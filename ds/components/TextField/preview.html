<!doctype html>
<html>
<head><meta charset="utf-8"><title>TextField — preview</title></head>
<body>
<div class="bd-backdrop"><div id="a" class="bd-row" style="align-items:flex-start"></div></div>
<script>
var D = window.BragDocUI, h = React.createElement;
ReactDOM.createRoot(document.getElementById('a')).render(h(React.Fragment, null,
  h('div', { style: { width: 260 } }, h(D.TextField, { label: 'Email', type: 'email', icon: 'mail', placeholder: 'Email address', hint: 'We send the receipt here.' })),
  h('div', { style: { width: 260 } }, h(D.TextField, { label: 'Card number', defaultValue: '4242 42', error: 'Enter all 16 digits.' })),
  h('div', { style: { width: 200 } }, h(D.TextField, { label: 'Promo code', placeholder: 'Optional', disabled: true }))));
</script>
</body>
