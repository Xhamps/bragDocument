version: "2"

run:
  timeout: 3m
  build-tags:
    - integration

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - govet
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        domain:
          files:
            - "**/internal/domain/**"
            - "!$test"
          allow:
            - $gostd
        app-and-ports:
          files:
            - "**/internal/app/**"
            - "**/internal/ports/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/xhamps/bragdocument/backend/internal/domain
            - github.com/xhamps/bragdocument/backend/internal/ports
        adapter-http:
          files:
            - "**/internal/adapters/http/**"
          deny:
            - pkg: github.com/xhamps/bragdocument/backend/internal/adapters/postgres
              desc: adapters must not import each other; share code through ports, domain, or telemetry
            - pkg: github.com/xhamps/bragdocument/backend/internal/adapters/llm
              desc: adapters must not import each other; share code through ports, domain, or telemetry
            - pkg: github.com/xhamps/bragdocument/backend/internal/adapters/redis
              desc: adapters must not import each other; share code through ports, domain, or telemetry
            - pkg: github.com/xhamps/bragdocument/backend/internal/adapters/telegram
              desc: adapters must not import each other; share code through ports, domain, or telemetry
            - pkg: github.com/xhamps/bragdocument/backend/internal/adapters/email
              desc: adapters must not import each other; share code through ports, domain, or telemetry
        adapter-postgres:
          files:
            - "**/internal/adapters/postgres/**"
          deny:
            - pkg: github.com/xhamps/bragdocument/backend/internal/adapters/http
              desc: adapters must not import each other; share code through ports, domain, or telemetry
            - pkg: github.com/xhamps/bragdocument/backend/internal/adapters/llm
              desc: adapters must not import each other; share code through ports, domain, or telemetry
            - pkg: github.com/xhamps/bragdocument/backend/internal/adapters/redis
              desc: adapters must not import each other; share code through ports, domain, or telemetry
            - pkg: github.com/xhamps/bragdocument/backend/internal/adapters/telegram
              desc: adapters must not import each other; share code through ports, domain, or telemetry
            - pkg: github.com/xhamps/bragdocument/backend/internal/adapters/email
              desc: adapters must not import each other; share code through ports, domain, or telemetry
        adapter-redis:
          files:
            - "**/internal/adapters/redis/**"
          deny:
            - pkg: github.com/xhamps/bragdocument/backend/internal/adapters/http
              desc: adapters must not import each other; share code through ports, domain, or telemetry
            - pkg: github.com/xhamps/bragdocument/backend/internal/adapters/postgres
              desc: adapters must not import each other; share code through ports, domain, or telemetry
            - pkg: github.com/xhamps/bragdocument/backend/internal/adapters/llm
              desc: adapters must not import each other; share code through ports, domain, or telemetry
            - pkg: github.com/xhamps/bragdocument/backend/internal/adapters/telegram
              desc: adapters must not import each other; share code through ports, domain, or telemetry
            - pkg: github.com/xhamps/bragdocument/backend/internal/adapters/email
              desc: adapters must not import each other; share code through ports, domain, or telemetry
        adapter-llm:
          files:
