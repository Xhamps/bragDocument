<!doctype html>
<html data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css">
<script src="../components/lib/react.production.min.js"></script><script src="../components/lib/react-dom.production.min.js"></script><script src="../components/bundle.js"></script>
<script>try{var t=new URLSearchParams(location.search).get('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script><meta charset="utf-8"><title>Elevation — preview</title>
<style>
  .lvl { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; padding: 32px 24px 8px; }
  .lvl .bd-card { height: 110px; display: flex; flex-direction: column; justify-content: flex-end; }
  .lvl .name { font: 500 14px/20px var(--font-sans); color: var(--fg-primary); }
  .lvl .use { font: 400 12px/16px var(--font-sans); color: var(--fg-secondary); }
  .demo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 16px 24px 24px; }
  .hint { padding: 0 24px; font: 400 13px/18px var(--font-sans); color: var(--fg-secondary); }
</style>
</head>
<body>
<div class="bd-backdrop"><div id="a"></div></div>
<script>
var D = window.BragDocUI, h = React.createElement;
var L = [['inset', 'shadow-inset', 'tracks, pressed'], ['sm', 'shadow-sm', 'tags, rows'], ['md', 'shadow-md', 'hovered controls'], ['lg', 'shadow-lg', 'hovered cards'], ['xl', 'shadow-xl', 'dialogs, floating']];
function App() {
  return h(React.Fragment, null,
    h('div', { className: 'lvl' }, L.map(function (l, i) {
      return h(D.Card, { key: l[0], tint: 'none', compact: true, animate: true, delay: i * 60, style: { boxShadow: 'var(--' + l[1] + ')' } },
        h('span', { className: 'name' }, l[1]), h('span', { className: 'use' }, l[2]));
    })),
    h('p', { className: 'hint' }, 'Hover and press the cards and buttons below.'),
    h('div', { className: 'demo' },
      h(D.Card, { interactive: true, tint: 'accent', title: 'Interactive card', description: 'Lifts 4px to shadow-lg with a sheen sweep.', animate: true, delay: 300 }),
      h(D.Card, { tint: 'sheen', title: 'Controls', animate: true, delay: 360 },
        h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 8, marginTop: 8 } },
          h(D.Button, { chevron: true }, 'Glass'), h(D.Button, { variant: 'primary', trailingIcon: 'arrowRight' }, 'Primary'),
          h(D.IconButton, { icon: 'plus', label: 'Add', variant: 'primary', shape: 'diamond', size: 'lg', glow: true }),
          h(D.Toggle, { defaultChecked: true, label: 'Spring' }))),
      h(D.Card, { tint: 'violet', title: 'Get started', animate: true, delay: 420 },
        h('div', { style: { display: 'flex', gap: 8, marginTop: 8, alignItems: 'center' } },
          h(D.Button, { variant: 'gradient', chevron: true }, 'Get Started'),
          h(D.Checkbox, { label: 'Pop', defaultChecked: true })))));
}
ReactDOM.createRoot(document.getElementById('a')).render(h(App));
</script>
</body>
</html>
